<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ローン返済シミュレーター</title>
  <style>
    :root { --fg: #1f2933; --muted: #616e7c; --line: #e4e7eb; --accent: #1b6ac9; --bg: #fff; --panel: #f5f7fa; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e4e7eb; --muted: #9aa5b1; --line: #323f4b; --accent: #5fa8ff; --bg: #12171c; --panel: #1c242c; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; color: var(--fg); background: var(--bg); }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; font-size: .9rem; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end; background: var(--panel); padding: 16px; border-radius: 10px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
    input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
    button { font: inherit; padding: 9px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 24px 0; }
    .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
    .card span { display: block; color: var(--muted); font-size: .8rem; }
    .card strong { font-size: 1.3rem; font-variant-numeric: tabular-nums; }
    .error { color: #d64545; margin-top: 16px; }
    .table-wrap { overflow-x: auto; max-height: 480px; border: 1px solid var(--line); border-radius: 10px; }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: .9rem; }
    th, td { padding: 6px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { position: sticky; top: 0; background: var(--panel); }
    footer { margin-top: 24px; color: var(--muted); font-size: .8rem; }
  </style>
</head>
<body>
<main>
  <h1>ローン返済シミュレーター</h1>
  <p class="sub">元利均等返済の計算は COBOL（GnuCOBOL）、API と画面は FastAPI が担当しています。</p>

  <form id="loan-form">
    <label>借入額（円）<input name="principal" type="number" min="1" value="30000000" required></label>
    <label>年利（%）<input name="annual_rate" type="number" min="0" max="20" step="0.0001" value="1.5" required></label>
    <label>返済期間（月）<input name="months" type="number" min="1" max="600" value="420" required></label>
    <button type="submit">計算する</button>
  </form>

  <div id="error" class="error" hidden></div>

  <section id="result" hidden>
    <div class="summary">
      <div class="card"><span>毎月の返済額</span><strong id="monthly"></strong></div>
      <div class="card"><span>総返済額</span><strong id="total"></strong></div>
      <div class="card"><span>利息合計</span><strong id="interest"></strong></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>回</th><th>返済額</th><th>元金</th><th>利息</th><th>残高</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <footer>API ドキュメント: <a href="/docs">/docs</a></footer>
</main>
<script>
  const yen = (n) => n.toLocaleString("ja-JP") + " 円";
  const form = document.getElementById("loan-form");
  const errorBox = document.getElementById("error");
  const result = document.getElementById("result");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const body = {
      principal: Number(fd.get("principal")),
      annual_rate: fd.get("annual_rate"),
      months: Number(fd.get("months")),
    };
    errorBox.hidden = true;
    const res = await fetch("/api/loan/schedule", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) {
      result.hidden = true;
      errorBox.textContent = "入力内容を確認してください: " + JSON.stringify(data.detail);
      errorBox.hidden = false;
      return;
    }
    document.getElementById("monthly").textContent = yen(data.monthly_payment);
    document.getElementById("total").textContent = yen(data.total_paid);
    document.getElementById("interest").textContent = yen(data.total_interest);
    const rows = document.getElementById("rows");
    rows.replaceChildren(...data.installments.map((r) => {
      const tr = document.createElement("tr");
      for (const v of [r.month, yen(r.payment), yen(r.principal), yen(r.interest), yen(r.balance)]) {
        const td = document.createElement("td");
        td.textContent = v;
        tr.appendChild(td);
      }
      return tr;
    }));
    result.hidden = false;
  });
</script>
</body>
</html>
